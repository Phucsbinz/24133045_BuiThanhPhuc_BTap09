<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 - Quyền truy cập bị từ chối</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card" style="width: min(520px, 94vw); text-align: center;">
    <div style="font-size: 64px; margin-bottom: 10px;">🚫</div>
    <h1 style="color: #dc2626;">403 FORBIDDEN</h1>
    <h2>Quyền truy cập bị từ chối</h2>

    <div class="alert error" style="text-align: left;">
        Rất tiếc! Tài khoản của bạn hiện không có vai trò <strong>Quản trị viên (ROLE_ADMIN)</strong> để truy cập tài nguyên bảo mật này.
    </div>

    <div class="panel" style="background: #f8fafc; padding: 16px; margin: 16px 0; text-align: left; font-size: 14px;" sec:authorize="isAuthenticated()">
        <p style="margin: 0 0 6px 0;"><strong>Tài khoản hiện tại:</strong> <span sec:authentication="principal.fullName">Họ tên</span></p>
        <p style="margin: 0 0 6px 0;"><strong>Username:</strong> <code sec:authentication="principal.username">user01</code></p>
        <p style="margin: 0 0 6px 0;"><strong>Vai trò thực tế:</strong> <span class="badge badge-user" sec:authentication="principal.role">ROLE_USER</span></p>
        <p style="margin: 0;"><strong>Yêu cầu bảo mật:</strong> <span class="badge badge-admin">ROLE_ADMIN</span></p>
    </div>

    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <a th:href="@{/}" class="btn secondary">🏠 Về Trang chọn bài</a>
        <form th:action="@{/vd1/logout}" method="post" style="display:inline; margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn danger" type="submit">Đổi tài khoản khác</button>
        </form>
    </div>
</div>
</body>
</html>
