<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="header">
    <a class="brand" th:href="@{/vd3/home}">IOTSTAR SHOP</a>
    <nav>
        <a th:href="@{/vd3/home}">Dashboard</a>
        <a th:href="@{/vd3/products}">Sản phẩm</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/vd3/users}">Người dùng</a>
        <a th:href="@{/}">Chọn ví dụ</a>
    </nav>
    <div class="account" sec:authorize="isAuthenticated()">
        <img class="avatar" th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}" alt="Ảnh đại diện">
        <span th:text="${#authentication.principal.fullName}">Họ tên</span>
        <span class="muted" th:text="'(' + ${#authentication.principal.username} + ')'">(username)</span>
        <span class="badge" th:text="${#authentication.principal.role}">ROLE_USER</span>
        <form th:action="@{/vd3/logout}" method="post"><button class="link-button" type="submit">Đăng xuất</button></form>
    </div>
    <div sec:authorize="isAnonymous()"><a th:href="@{/vd3/login}">Đăng nhập</a></div>
</header>
</body>
</html>
