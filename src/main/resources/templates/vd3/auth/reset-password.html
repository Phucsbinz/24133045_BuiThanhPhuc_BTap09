<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><section class="auth-card"><a th:href="@{/vd3/login}">← Đăng nhập</a><h1>Đặt lại mật khẩu</h1>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <form th:action="@{/vd3/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
        <label>Email</label><input type="email" th:field="*{email}" autocomplete="email"><small class="error-text" th:errors="*{email}"></small>
        <label>OTP</label><input th:field="*{otp}" inputmode="numeric" autocomplete="one-time-code"><small class="error-text" th:errors="*{otp}"></small>
        <label>Mật khẩu mới</label><input type="password" th:field="*{password}" autocomplete="new-password"><small class="error-text" th:errors="*{password}"></small>
        <label>Xác nhận mật khẩu</label><input type="password" th:field="*{confirmPassword}" autocomplete="new-password"><small class="error-text" th:errors="*{confirmPassword}"></small>
        <button class="button full mt">Đổi mật khẩu</button>
    </form>
</section></body></html>
