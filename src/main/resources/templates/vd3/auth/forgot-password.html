<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quên mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><section class="auth-card"><a th:href="@{/vd3/login}">← Đăng nhập</a><h1>Quên mật khẩu</h1>
    <form th:action="@{/vd3/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
        <label>Email tài khoản</label><input type="email" th:field="*{email}" autocomplete="email"><small class="error-text" th:errors="*{email}"></small>
        <button class="button full mt">Gửi OTP</button>
    </form>
</section></body></html>
