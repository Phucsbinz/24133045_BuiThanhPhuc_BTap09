# Import .env if available
spring.config.import=optional:file:.env[.properties]

spring.application.name=24133045_BuiThanhPhuc_Security_VD12
server.port=${SERVER_PORT:8091}
server.servlet.session.cookie.name=BTAP09_VD12_SESSION
spring.main.allow-bean-definition-overriding=true

# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/btap09_vd12?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ptpn06082006}

# ===============================
# JPA & HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ===============================
# ENCODING & UPLOAD
# ===============================
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
spring.servlet.encoding.force-request=true
spring.servlet.encoding.force-response=true

# ===============================
# LOGGING
# ===============================
logging.level.vn.iotstar=INFO
logging.level.org.springframework.security=WARN
